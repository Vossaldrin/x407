name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: Backend — syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No Python test suite exists (per CONTRIBUTING.md, backend changes are
      # verified against a real hired agent) — CI guards syntax only.
      - run: python -m py_compile backend/*.py

  contracts:
    name: Contracts — forge test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # lib/ is gitignored and there is no .gitmodules, so dependencies are
      # installed explicitly, pinned to the versions the repo developed against.
      - run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts@v5.6.1
      - run: forge build
      - run: forge test -vv
